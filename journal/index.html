<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — GuinEeeeeeeeeeeeeeeeeeeeeeeerm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="brand">GuinEeeeeeeeeeeeeeeeeeeeeeeerm</div>
    <nav><a href="../index.html">home</a> · <a href="index.html">journal</a></nav>
  </header>
  <h1>Journal</h1>
  <p class="meta">생각을 정리하는 위키형 일기장. 완성된 결론보다, 진행 중인 고민을 기록합니다.</p>
  <ul class="post-list" id="list"></ul>
  <footer>© GuinEeeeeeeeeeeeeeeeeeeeeeeerm</footer>
</div>
<script>
fetch('posts.json').then(r=>r.json()).then(posts=>{
  posts.sort((a,b)=> b.date.localeCompare(a.date));
  const list = document.getElementById('list');
  list.innerHTML = posts.map(p => `
    <li>
      <div class="date">${p.date}</div>
      <div class="title"><a href="post.html?slug=${encodeURIComponent(p.slug)}">${p.title}</a></div>
      <div class="desc">${p.desc}</div>
    </li>
  `).join('');
});
</script>
</body>
</html>
